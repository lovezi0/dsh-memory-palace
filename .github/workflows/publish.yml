name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # 用 npm install 而非 npm ci：lock 在 Windows 下生成，只含本平台 optional 二进制包
      # （node-addon-require-builtin 等），npm 11 的 npm ci 会严格校验并要求所有平台条目而报错。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Self-test
        run: npm run selftest

      - name: Resolve dist-tag
        run: |
          pkg="$(node -p 'require("./package.json").version')"
          case "$pkg" in
            *-*) dist_tag="$(node -p "require('./package.json').version.split('-')[1].split('.')[0]")" ;;
            *)   dist_tag="latest" ;;
          esac
          echo "dist_tag=$dist_tag" >> "$GITHUB_ENV"

      - name: Publish
        run: npm publish --tag "$dist_tag"