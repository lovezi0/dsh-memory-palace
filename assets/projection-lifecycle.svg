<svg viewBox="0 0 680 490" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>记忆投影生命周期（含 compaction 重注）· v1.7.1</title>
  <desc>system prompt 只保留恒定指令；用户级、项目级 MEMORY.md 与今日工作日志三类投影在会话首同批注入一次，此后内容再变也不重注；compaction 把投影裁掉后按条重注磁盘最新版，读到的即最新内容。</desc>

  <text x="40" y="26" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">记忆投影生命周期 · v1.7.1</text>

  <text x="40" y="54" font-family="sans-serif" font-size="12" font-weight="500" fill="#5F5E5A">compaction 之前</text>

  <rect x="40" y="62" width="430" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="56" y="79" font-family="sans-serif" font-size="12" fill="#0C447C" dominant-baseline="central">system prompt（恒定）：插件说明 + 记忆分工说明</text>
  <text x="482" y="79" font-family="sans-serif" font-size="11" fill="#0C447C" dominant-baseline="central">前缀永久有效</text>

  <rect x="40" y="104" width="430" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="56" y="121" font-family="sans-serif" font-size="12" fill="#444441" dominant-baseline="central">user · 提问 #1</text>

  <rect x="40" y="146" width="430" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="56" y="163" font-family="sans-serif" font-size="12" fill="#085041" dominant-baseline="central">投影 ×3：用户级 · 项目级 · 今日工作日志</text>
  <text x="482" y="163" font-family="sans-serif" font-size="11" fill="#085041" dominant-baseline="central">会话首同批注入</text>

  <rect x="40" y="188" width="430" height="34" rx="6" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="56" y="205" font-family="sans-serif" font-size="12" fill="#888780" dominant-baseline="central">assistant / tool ⋯　user 提问 #2 ⋯ #N</text>
  <text x="482" y="205" font-family="sans-serif" font-size="11" fill="#5F5E5A" dominant-baseline="central">此后零新增投影</text>

  <rect x="40" y="238" width="572" height="34" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="56" y="255" font-family="sans-serif" font-size="12" fill="#854F0B" dominant-baseline="central">compaction：早期历史被压缩成摘要　→　三条投影一起被裁</text>

  <text x="40" y="302" font-family="sans-serif" font-size="12" font-weight="500" fill="#5F5E5A">compaction 之后</text>

  <rect x="40" y="310" width="430" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="56" y="327" font-family="sans-serif" font-size="12" fill="#0C447C" dominant-baseline="central">system prompt（同一份，未被触碰）</text>
  <text x="482" y="327" font-family="sans-serif" font-size="11" fill="#0C447C" dominant-baseline="central">恒定 → 不受影响</text>

  <rect x="40" y="352" width="430" height="34" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="56" y="369" font-family="sans-serif" font-size="12" fill="#5F5E5A" dominant-baseline="central">摘要　+　保留下来的近期消息</text>

  <rect x="40" y="394" width="430" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="56" y="411" font-family="sans-serif" font-size="12" fill="#444441" dominant-baseline="central">user · 提问 #N+1</text>

  <rect x="40" y="436" width="430" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="56" y="453" font-family="sans-serif" font-size="12" fill="#085041" dominant-baseline="central">投影 ×3 重注：用户级 · 项目级 · 今日工作日志</text>
  <text x="482" y="444" font-family="sans-serif" font-size="11" fill="#085041">读磁盘最新版</text>
  <text x="482" y="460" font-family="sans-serif" font-size="11" fill="#085041">落此刻尾部，不碰前缀</text>
</svg>
