<svg viewBox="0 0 680 636" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>混合模式（hybrid）调用时序图</title>
  <desc>会话首轮注入记忆正文与提示词；每轮 turn/end 由记忆子代理判定并写入今日日志（log_read_section 一次读多章节、失败不降级下轮补蒸）；agent 主动调用工具维护 MEMORY.md。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="26" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">混合模式（hybrid）调用时序 · v1.6.0</text>

  <rect x="32" y="44" width="56" height="24" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="60" y="60" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#0C447C">会话</text>
  <rect x="157" y="44" width="56" height="24" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="185" y="60" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#085041">插件</text>
  <rect x="292" y="44" width="56" height="24" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="320" y="60" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#633806">子代理</text>
  <rect x="437" y="44" width="56" height="24" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="465" y="60" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#3C3489">文件</text>
  <rect x="562" y="44" width="56" height="24" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="590" y="60" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">agent</text>

  <line x1="60" y1="74" x2="60" y2="600" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="185" y1="74" x2="185" y2="600" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="320" y1="74" x2="320" y2="600" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="465" y1="74" x2="465" y2="600" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="590" y1="74" x2="590" y2="600" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>

  <text x="40" y="96" font-family="sans-serif" font-size="12" font-weight="500" fill="#5F5E5A">A · 注入</text>
  <path d="M60 108 L185 108" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="122" y="102" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">system-prompt/assemble</text>
  <path d="M185 128 L60 128" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="122" y="122" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">段一+段二 + 记忆正文块（仅首轮）</text>
  <text x="40" y="148" font-family="sans-serif" font-size="11" fill="#888780">compaction/* 后清除 injectedSessionIds → 下次 assemble 重注正文</text>

  <text x="40" y="176" font-family="sans-serif" font-size="12" font-weight="500" fill="#5F5E5A">B · 每轮 turn/end</text>
  <path d="M60 190 L185 190" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="122" y="184" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444441">turn/end（debounce 1.5s 结算）</text>
  <path d="M185 212 L320 212" fill="none" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="252" y="206" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#854F0B">runMemorySubagent（每轮必跑，不走闸门）</text>
  <path d="M320 234 L465 234" fill="none" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="392" y="228" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#534AB7">读今日日志（≤20k 全文 / 超出仅章节目录）</text>
  <path d="M330 256 C 348 256 348 274 330 274" fill="none" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="378" y="270" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#854F0B">stream#1 判定+产出一体（tools 白名单）</text>
  <path d="M330 296 C 348 296 348 314 330 314" fill="none" stroke="#3B6D11" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="378" y="310" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#3B6D11">无重点 → stop 纯文本收尾（推进断点）</text>
  <path d="M320 336 L465 336" fill="none" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="392" y="330" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#854F0B">有重点 → tool-call log_write_ops（可先 log_read_section(sections[]) 一次读多章）</text>
  <path d="M465 356 L320 356" fill="none" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="392" y="350" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#534AB7">写日志：new_section / append / mark_delete（删除线墓碑）</text>
  <path d="M330 378 C 348 378 348 396 330 396" fill="none" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="378" y="392" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#854F0B">tool-result 回喂 → stream#2..N → stop（≤6 轮）</text>
  <path d="M320 418 L185 418" fill="none" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="252" y="412" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#3B6D11">推进 lastSummarizedSeq</text>
  <path d="M320 440 L185 440" fill="none" stroke="#A32D2D" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="252" y="434" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#A32D2D">失败 / 超时 / 超 6 轮 → 本轮放弃（不降级；断点不推进 → 下轮补蒸）</text>

  <text x="40" y="472" font-family="sans-serif" font-size="12" font-weight="500" fill="#5F5E5A">C · agent 主动维护 MEMORY.md</text>
  <path d="M590 488 L185 488" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="387" y="482" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">memory_write / memory_update_section（章节化 / 整章节 stale 校验）</text>
  <path d="M185 508 L465 508" fill="none" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="502" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#534AB7">章节存在追加 / 不存在新建；标删走删除线</text>
  <path d="M590 530 L185 530" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="387" y="524" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#185FA5">memory_reorganize（项目级，双门禁：超预算 + 冷却 ≥ reorgCooldownDays）</text>
  <path d="M185 550 L590 550" fill="none" stroke="#A32D2D" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="387" y="544" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#A32D2D">pre-execute ask 弹窗 → 真人确认（门禁不满足直接 deny）</text>
  <path d="M185 570 L465 570" fill="none" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="564" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#534AB7">原子替换 + 时间戳备份 + last-reorg 注释落文件尾</text>

  <text x="40" y="618" font-family="sans-serif" font-size="11" fill="#888780">用户级 MEMORY.md 仅 memory_write / memory_update_section（scope=user），禁止 reorganize</text>
</svg>
